name: Windows release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, for example 0.2.0-beta.1
        required: true
        type: string
      publish:
        description: Publish this release (otherwise keep a draft)
        required: false
        default: false
        type: boolean
  push:
    tags: ['v[0-9]*']
permissions:
  contents: write
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Validate version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { $env:REQUESTED_VERSION }
          . ./scripts/ReleaseVersion.ps1
          $version = (Get-ReleaseVersion $version).Text
          $sourceVersion = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version
          if ($sourceVersion -ne $version) { throw 'Release version must match Directory.Build.props. Use scripts/Release.ps1.' }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Fixture tests
        shell: pwsh
        run: dotnet test tests/VrcSetup.Core.Tests/VrcSetup.Core.Tests.csproj -c Release --nologo
      - name: Build self-contained installer and portable archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $baseArchive = $null
          # Use the newest complete, older release, across beta/rc/stable series.
          . ./scripts/ReleaseVersion.ps1
            $releases = gh api repos/dummics/vrchat-project-setup/releases | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Could not inspect previous releases.' }
            $candidates = foreach ($release in $releases) {
              if ($release.draft) { continue }
              try { $key = Get-ReleaseVersion $release.tag_name } catch { continue }
              if ((Compare-ReleaseVersion $key.Text $env:RELEASE_VERSION) -ge 0) { continue }
              if (-not ($release.assets | Where-Object name -eq "VrcSetup-$($key.Text)-win-x64.zip")) { continue }
              if (-not ($release.assets | Where-Object name -eq 'SHA256SUMS.txt')) { continue }
              [pscustomobject]@{ Release=$release; Core=$key.Core; Rank=$key.Rank; Iteration=$key.Iteration }
            }
            $basis = ($candidates | Sort-Object Core,Rank,Iteration -Descending | Select-Object -First 1).Release
            if ($basis) {
              $name = "VrcSetup-$($basis.tag_name.TrimStart('v'))-win-x64.zip"
              $asset = $basis.assets | Where-Object name -eq $name | Select-Object -First 1
              $sums = $basis.assets | Where-Object name -eq SHA256SUMS.txt | Select-Object -First 1
              if ($asset -and $sums) {
                $baseArchive = Join-Path $env:RUNNER_TEMP $name
                Invoke-WebRequest $asset.browser_download_url -OutFile $baseArchive
                $content = (Invoke-WebRequest $sums.browser_download_url).Content
                $checksumText = if ($content -is [byte[]]) { [Text.Encoding]::UTF8.GetString($content) } else { [string]$content }
                $expected = @($checksumText -split '\n' | Where-Object { $_.Trim().EndsWith('  ' + $name) } | ForEach-Object { ($_.Trim() -split '\s+')[0] })
                if ($expected.Count -ne 1 -or (Get-FileHash $baseArchive).Hash -ne $expected[0]) { throw 'Previous archive checksum failed.' }
              }
            }
          ./scripts/Publish-Windows.ps1 -Version $env:RELEASE_VERSION -OutputDirectory release
          if ($baseArchive) { "UPDATE_BASE_ARCHIVE=$baseArchive" >> $env:GITHUB_ENV }
      - name: Native UI smoke verification
        shell: pwsh
        run: |
          $exe = Join-Path $pwd "release/VrcSetup-$env:RELEASE_VERSION-win-x64/app/desktop/VrcSetup.Desktop.exe"
          $artifacts = Join-Path $env:RUNNER_TEMP 'vrcsetup-ui'
          $start = [Diagnostics.ProcessStartInfo]::new($exe)
          $start.UseShellExecute = $false
          $start.ArgumentList.Add('--smoke-test')
          $start.ArgumentList.Add($artifacts)
          $process = [Diagnostics.Process]::Start($start)
          if (-not $process.WaitForExit(180000)) { throw 'Native UI verification timed out.' }
          foreach ($name in @('failure.txt', 'unhandled.txt')) {
            $failure = Join-Path $artifacts $name
            if (Test-Path $failure) { Get-Content $failure -TotalCount 40 }
          }
          $result = Get-Content (Join-Path $artifacts 'ui-smoke.json') -Raw | ConvertFrom-Json
          if ($process.ExitCode -ne 0 -or -not $result.Passed) { throw 'Native UI verification failed.' }
      - name: Preserve native UI verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ui-verification
          path: ${{ runner.temp }}/vrcsetup-ui
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify install, repair and shortcut migration
        shell: pwsh
        run: |
          ./tests/Run-InstallerTests.ps1 -Installer (Join-Path $pwd "release/Install-VrcSetup-$env:RELEASE_VERSION-win-x64.exe") -TestRoot (Join-Path $env:RUNNER_TEMP 'installer-lifecycle') -ComponentsDirectory (Join-Path $pwd release)
      - name: Verify unified installer update and restart
        if: env.UPDATE_BASE_ARCHIVE != ''
        shell: pwsh
        run: |
          $basis = Join-Path $env:RUNNER_TEMP 'update-base'
          Expand-Archive -LiteralPath $env:UPDATE_BASE_ARCHIVE -DestinationPath $basis
          $full = Join-Path $pwd "release/Install-VrcSetup-$env:RELEASE_VERSION-win-x64.exe"
          ./scripts/Test-ApplicationUpdate.ps1 -BasePayload $basis -UpdateInstaller $full -OutputDirectory (Join-Path $env:RUNNER_TEMP 'update-full') -ComponentsDirectory (Join-Path $pwd release)
      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RELEASE: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          $executables = @(Get-ChildItem release -File -Filter '*.exe')
          if ($executables.Count -ne 1) { throw 'Publish exactly one unified Windows installer.' }
          $assets = @("release/Install-VrcSetup-$env:RELEASE_VERSION-win-x64.exe#VrcSetup-$env:RELEASE_VERSION-win-x64.exe", "release/VrcSetup-$env:RELEASE_VERSION-win-x64.zip#Portable ZIP (optional)", 'release/SHA256SUMS.txt')
          $assets += 'release/components.json'
          $assets += @(Get-ChildItem release -File -Filter '*.zip' | Where-Object Name -Match '^[a-f0-9]{64}\.zip$' | ForEach-Object FullName)
          $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          @"
          <!-- vrcsetup-download:start -->
          [![Download this version](https://img.shields.io/badge/Download_this_version-Windows_x64-2ea493?style=for-the-badge)](https://github.com/dummics/vrchat-project-setup/releases/download/$tag/Install-VrcSetup-$env:RELEASE_VERSION-win-x64.exe)
          <!-- vrcsetup-download:end -->

          Use the button above to install or update this version. Setup preserves your settings and opens the app automatically.

          Internet is required for uncached components. The portable ZIP is optional. Hash-named ZIPs and components.json are internal installer assets: you do not need to download them manually. This is a beta for testing.

          The app checks periodically while open, prepares supported updates in the background, and installs them on the next launch. Settings > Updates controls automatic updates; the footer still allows an immediate update. Existing installations need to install this version once to enable the new behavior.
          "@ | Set-Content -LiteralPath $notes -Encoding utf8
          $arguments = @('release','create',$tag,'--target',$env:GITHUB_SHA,'--title',$env:RELEASE_VERSION,'--notes-file',$notes,'--generate-notes')
          # Upload into a draft first: clients must never discover an EXE while
          # its component archives are still being uploaded.
          $arguments += '--draft'
          if ($env:RELEASE_VERSION.Contains('-')) { $arguments += '--prerelease' }
          & gh @arguments @assets
          if ($LASTEXITCODE -ne 0) { throw 'Release failed. Existing releases are never overwritten.' }
          $uploaded = & gh release view $tag --json assets --jq '.assets | length'
          if ($LASTEXITCODE -ne 0 -or [int]$uploaded -ne $assets.Count) { throw 'Draft asset verification failed; release remains unpublished.' }
          if ($env:PUBLISH_RELEASE -eq 'true') {
            & gh release edit $tag --draft=false
            if ($LASTEXITCODE -ne 0) { throw 'Publishing failed; verified assets remain in the draft.' }
          }

name: Windows release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, for example 0.2.0-beta.1
        required: true
        type: string
      publish:
        description: Publish this release (otherwise keep a draft)
        required: false
        default: false
        type: boolean
  push:
    tags: ['v0.*']
permissions:
  contents: write
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Validate version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { $env:REQUESTED_VERSION }
          if ($version -notmatch '^0\.[0-9]+\.[0-9]+(?:-(?:beta|rc)\.[0-9]+)?$') { throw 'Use a 0.x.y beta, rc or stable version.' }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Fixture tests
        shell: pwsh
        run: dotnet test tests/VrcSetup.Core.Tests/VrcSetup.Core.Tests.csproj -c Release --nologo
      - name: Build self-contained installer and portable archive
        shell: pwsh
        run: ./scripts/Publish-Windows.ps1 -Version $env:RELEASE_VERSION -OutputDirectory release
      - name: Native UI smoke verification
        shell: pwsh
        run: |
          $exe = Join-Path $pwd "release/VrcSetup-$env:RELEASE_VERSION-win-x64/app/desktop/VrcSetup.Desktop.exe"
          $artifacts = Join-Path $env:RUNNER_TEMP 'vrcsetup-ui'
          $start = [Diagnostics.ProcessStartInfo]::new($exe)
          $start.UseShellExecute = $false
          $start.ArgumentList.Add('--smoke-test')
          $start.ArgumentList.Add($artifacts)
          $process = [Diagnostics.Process]::Start($start)
          if (-not $process.WaitForExit(180000)) { throw 'Native UI verification timed out.' }
          foreach ($name in @('failure.txt', 'unhandled.txt')) {
            $failure = Join-Path $artifacts $name
            if (Test-Path $failure) { Get-Content $failure -TotalCount 40 }
          }
          $result = Get-Content (Join-Path $artifacts 'ui-smoke.json') -Raw | ConvertFrom-Json
          if ($process.ExitCode -ne 0 -or -not $result.Passed) { throw 'Native UI verification failed.' }
      - name: Preserve native UI verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ui-verification
          path: ${{ runner.temp }}/vrcsetup-ui
          if-no-files-found: ignore
          retention-days: 7
      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RELEASE: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          $assets = @("release/Install-VrcSetup-$env:RELEASE_VERSION-win-x64.exe", "release/VrcSetup-$env:RELEASE_VERSION-win-x64.zip", 'release/SHA256SUMS.txt')
          $arguments = @('release','create',$tag,'--target',$env:GITHUB_SHA,'--title',"VRChat Project Setup $env:RELEASE_VERSION",'--generate-notes')
          if ($env:PUBLISH_RELEASE -ne 'true') { $arguments += '--draft' }
          if ($env:RELEASE_VERSION.Contains('-')) { $arguments += '--prerelease' }
          & gh @arguments @assets
          if ($LASTEXITCODE -ne 0) { throw 'Release failed. Existing releases are never overwritten.' }

name: Bug report
description: Report a problem with VRChat Project Setup
title: "[Bug]: "
body:
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: 0.2.0-beta.1
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you do?
      description: Include the steps and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Screenshot or log excerpt (optional)
      description: Remove personal paths, avatar content and account details before sharing. Logs are never attached automatically.
